[project]
name = "biomni-filter-mcp"
version = "0.1.0"
description = "MCP server that filters Biomni tools using an OpenAI-compatible endpoint"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.17.3",
]
